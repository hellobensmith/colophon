name = "colophon"
main = "src/index.ts"
compatibility_date = "2026-09-02"

# The ASV corpus is embedded in the bundle, so the Worker needs no bindings,
# secrets, or network access at runtime.

# There is deliberately no [cache] block here. One was present and did nothing:
# wrangler rejects it as an unexpected top-level field. Caching in front of the
# Worker is real — 8 identical requests measured 1 MISS and 7 HITs, invoking the
# Worker once — but it comes from the explicit Cache-Control header the Worker
# sets, plus Cloudflare's default edge caching. Re-adding the key would only
# restore the wrong explanation.

[observability]
enabled = true
