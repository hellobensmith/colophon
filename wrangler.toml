name = "colophon"
main = "src/index.ts"
compatibility_date = "2026-09-02"

# The ASV corpus is embedded in the bundle, so the Worker needs no bindings,
# secrets, or network access at runtime.

# Cache responses in front of the Worker. On a hit the Worker does not run at
# all, so repeat traffic costs no CPU.
#
# Do not remove this because wrangler warns "Unexpected fields found in
# top-level field: cache". It warns, and then honours it. Removing it on the
# strength of that warning switched edge caching off on 7 September 2026:
# 8 identical requests went from 1 Worker invocation to 8, and cf-cache-status
# disappeared from the response entirely. `bun run check:platform` now measures
# this by counting invocations, so the same mistake fails loudly.
[cache]
enabled = true

[observability]
enabled = true

